name: 🐛Bug Report
description: Report a reproducible problem in ZSvirt
title: "[ZSvirt] bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail so we can reproduce and investigate it.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - zsvirt
        - zsvirt-utility
        - ui
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened?
      placeholder: Describe the issue clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, OS, browser, hypervisor, storage, network, deployment mode, or other relevant details.
      placeholder: |
        ZSvirt version:
        OS:
        Browser:
        Deployment mode:
        Related component:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste logs, error messages, screenshots, or related links.
    validations:
      required: false
